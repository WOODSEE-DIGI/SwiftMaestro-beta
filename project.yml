name: SwiftMaestro
targetBundleIdentifierPrefix: com.woodseedigi.swiftmaestro
options:
  bundleIdPrefix: com.woodseedigi
  deploymentTarget: macOS 14.0
  xcodeVersion: "16"

packages:
  SwiftMaestroKit:
    path: ../../AI-ML-Agents/SwiftMaestroKit
  mlx-swift-lm:
    path: ../../AI-ML-Agents/mlx-swift-lm
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    majorVersion: 1.3.0
  mcp-swift-sdk:
    path: ../../AI-ML-Agents/mcp-swift-sdk
  whisperkit:
    path: ../../AI-ML-Agents/WhisperKit
  GRDB:
    url: https://github.com/groue/GRDB.swift
    majorVersion: 7.0.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    majorVersion: 1.14.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.0

groups:
  - Sources
  - Resources
  - Tests

fileGroups: []

configurations:
  Debug: debug
  Release: release

settings:
  base:
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    ARCHS: arm64

targets:
  SwiftMaestro:
    type: application
    platform: macOS
    sources:
      - path: Sources
        exclude:
          - "**/.gitignore"
      - path: Sources/App
      - path: Sources/Views
      - path: Sources/ViewModels
      - path: Sources/Adapters
      - path: Sources/Services
      - path: Sources/Models
      - path: Sources/Memory
      - path: Sources/Engine
      # Folder reference (preserves internal structure, e.g. plugin-id/index.html
      # + its own relative css/js) rather than individual flattened file refs.
      - path: Sources/Resources/Plugins
        type: folder
    settings:
      base:
        DEFINES_MODULE: YES
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.woodseedigi.swiftmaestro
        SWIFT_VERSION: 6.3
        MACOSX_DEPLOYMENT_TARGET: 14.0
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        INFOPLIST_FILE: Sources/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/SwiftMaestro.entitlements
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: "3BMZ2ULZ54"
          # Do NOT inject the debug base entitlements (get-task-allow); Apple
          # notarization rejects any executable that requests it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options runtime"
    postBuildScripts:
      - name: Bundle MCP Servers
        script: |
          # Copy bundled MCP servers into the app bundle's Resources directory.
          # They live outside Sources/ to avoid xcodegen/Xcode scanning the large
          # node_modules directories as source files.
          SRC="${SRCROOT}/BundledMCP/mcp-servers"
          DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/mcp-servers"
          if [ -d "$SRC" ]; then
            rm -rf "$DST"
            mkdir -p "$(dirname "$DST")"
            cp -R "$SRC" "$DST"
            echo "Bundled MCP servers: $SRC -> $DST"
          else
            echo "No bundled MCP servers at $SRC (skipping)"
          fi
        shell: /bin/bash
        alwaysOutOfDate: true
    dependencies:
      - package: SwiftMaestroKit
        product: SwiftMaestroKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Tokenizers
      - package: swift-transformers
        product: Hub
      - package: mcp-swift-sdk
        product: MCP
      - package: whisperkit
        product: WhisperKit
      - package: GRDB
        product: GRDB
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
        product: Sparkle
      - sdk: PDFKit.framework
      - sdk: EventKit.framework
      - sdk: Contacts.framework
      - sdk: MapKit.framework
      - sdk: Photos.framework
      - sdk: PaperKit.framework
      - sdk: PencilKit.framework
      - sdk: AppIntents.framework
    scheme:
      testTargets:
        - SwiftMaestroTests

  SwiftMaestroTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SwiftMaestro
    settings:
      SWIFT_VERSION: 6.3
      MACOSX_DEPLOYMENT_TARGET: 14.0
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.woodseedigi.swiftmaestrotests
      CODE_SIGN_IDENTITY: "-"

defaultLanguage: Swift
platforms: []

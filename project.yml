name: SwiftMaestro
targetBundleIdentifierPrefix: com.woodseedigi.swiftmaestro
options:
  bundleIdPrefix: com.woodseedigi
  deploymentTarget: macOS 14.0
  xcodeVersion: "16"
  # English is the development language; Japanese is the first localization.
  # Localizable.xcstrings lives at Sources/Resources/ and SwiftUI string
  # literals are extracted into it at build time (SWIFT_EMIT_LOC_STRINGS).
  knownRegions:
    - en
    - ja
    - zh-Hans
    - zh-Hant
    - ko
    - de
    - fr
    - es
    - es-419
    - it
    - pt-BR
    - pt-PT
    - nl
    - ru
    - ar
    - hi
    - th
    - vi
    - id
    - tr
    - pl
    - sv
    - da
    - nb
    - fi
    - cs
    - el
    - he
    - hu
    - ro
    - uk

packages:
  SwiftMaestroKit:
    path: Vendor/SwiftMaestroKit
  mlx-swift-lm:
    path: Vendor/mlx-swift-lm
  swift-transformers:
    path: Vendor/swift-transformers
  mcp-swift-sdk:
    path: Vendor/mcp-swift-sdk
  whisperkit:
    path: Vendor/WhisperKit
  GRDB:
    path: Vendor/GRDB.swift
  SwiftTerm:
    path: Vendor/SwiftTerm
  Sparkle:
    path: Vendor/Sparkle

groups:
  - Sources
  - Resources
  - Tests

fileGroups: []

configurations:
  Debug: debug
  Release: release

settings:
  base:
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    ARCHS: arm64

targets:
  SwiftMaestro:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "**/.gitignore"
          # Plugins ship only via the folder reference below — including them
          # in the Sources glob too flattens every plugin's files into one
          # Resources dir, and same-named files (index.html, app.js…) collide.
          # (browser-start.html / swiftmaestro-clipper.js intentionally stay in
          # the glob — they load from the bundle root.)
          - "Resources/Plugins/**"
      - path: Sources/App
      - path: Sources/Views
      - path: Sources/ViewModels
      - path: Sources/Adapters
      - path: Sources/Services
      - path: Sources/Models
      - path: Sources/Memory
      - path: Sources/Engine
      # Folder reference (preserves internal structure, e.g. plugin-id/index.html
      # + its own relative css/js) rather than individual flattened file refs.
      - path: Sources/Resources/Plugins
        type: folder
    # NOTE: xcodegen has no top-level `resources:` key — a previous block here
    # was silently ignored. Resource files ship via the Sources glob above.
    settings:
      base:
        DEFINES_MODULE: YES
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.woodseedigi.swiftmaestro
        SWIFT_VERSION: 6.3
        MACOSX_DEPLOYMENT_TARGET: 14.0
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/libusb/include $(SRCROOT)/Vendor/libraw/include $(SRCROOT)/Vendor/libjpeg/include $(SRCROOT)/Vendor/lcms2/include $(SRCROOT)/Sources"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/libusb/lib $(SRCROOT)/Vendor/libraw/lib $(SRCROOT)/Vendor/libjpeg/lib $(SRCROOT)/Vendor/lcms2/lib $(SRCROOT)/Vendor/libomp/lib"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/Modules/LibUSB/module.modulemap"
        OTHER_LDFLAGS: "$(inherited) -lusb-1.0 -lraw -lomp -llcms2 -ljpeg -lz"
        INFOPLIST_FILE: Sources/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/SwiftMaestro.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Resources/SwiftMaestro-Bridging-Header.h
        SWIFT_OBJC_INTEROP_MODE: objcxx
      configs:
        Debug:
          # Ad-hoc ("-") signatures change every rebuild, which makes the
          # Keychain treat each build as a different app — "Always Allow" was
          # forgotten and the login-keychain password prompt returned after
          # every rebuild. Sign with the stable development identity instead.
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: "3BMZ2ULZ54"
          # Disable Hardened Runtime for Debug builds. The app is not sandboxed,
          # and Hardened Runtime's entitlement requirements (especially Keychain
          # access groups) are unreliable with Xcode's local development signing.
          # Release builds keep Hardened Runtime enabled for notarization.
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: "3BMZ2ULZ54"
          # Do NOT inject the debug base entitlements (get-task-allow); Apple
          # notarization rejects any executable that requests it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options runtime"
    postBuildScripts:
      - name: Bundle MCP Servers
        script: |
          # Copy bundled MCP servers into the app bundle's Resources directory.
          # They live outside Sources/ to avoid xcodegen/Xcode scanning the large
          # node_modules directories as source files.
          SRC="${SRCROOT}/BundledMCP/mcp-servers"
          DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/mcp-servers"
          if [ -d "$SRC" ]; then
            rm -rf "$DST"
            mkdir -p "$(dirname "$DST")"
            cp -R "$SRC" "$DST"
            echo "Bundled MCP servers: $SRC -> $DST"
          else
            echo "No bundled MCP servers at $SRC (skipping)"
          fi
        shell: /bin/bash
        alwaysOutOfDate: true
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/mcp-servers
      - name: Bundle FFmpeg
        script: |
          # Copy bundled FFmpeg binaries into the app bundle's Resources directory.
          SRC_DIR="${SRCROOT}/BundledFFmpeg"
          DST_DIR="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources"
          if [ -d "$SRC_DIR" ]; then
            for BIN in ffmpeg ffprobe; do
              SRC="$SRC_DIR/$BIN"
              DST="$DST_DIR/$BIN"
              if [ -f "$SRC" ]; then
                rm -f "$DST"
                mkdir -p "$DST_DIR"
                cp "$SRC" "$DST"
                chmod +x "$DST"
                echo "Bundled FFmpeg binary: $SRC -> $DST"
              else
                echo "No bundled $BIN binary at $SRC (skipping)"
              fi
            done
          else
            echo "No bundled FFmpeg directory at $SRC_DIR (skipping)"
          fi
        shell: /bin/bash
        alwaysOutOfDate: true
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/ffmpeg
          - $(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/ffprobe
      - name: Bundle gphoto2
        script: |
          # Copy the gphoto2 CLI + libgphoto2 dylibs + driver modules into the
          # app bundle and rewrite Homebrew references to @rpath, so PTP camera
          # tethering works on machines without Homebrew.
          "${SRCROOT}/scripts/bundle-gphoto2.sh"
        shell: /bin/bash
        alwaysOutOfDate: true
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/gphoto2
      - name: Bundle WhisperKit Models
        script: |
          # Copy WhisperKit CoreML models into the app bundle so dictation
          # works on first launch without a ~3 GB download.
          "${SRCROOT}/scripts/bundle-whisperkit.sh"
        shell: /bin/bash
        alwaysOutOfDate: true
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/models/whisperkit
    dependencies:
      - package: SwiftMaestroKit
        product: SwiftMaestroKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Tokenizers
      - package: swift-transformers
        product: Hub
      - package: mcp-swift-sdk
        product: MCP
      - package: whisperkit
        product: WhisperKit
      - package: GRDB
        product: GRDB
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
        product: Sparkle
      - sdk: PDFKit.framework
      - sdk: EventKit.framework
      - sdk: Contacts.framework
      - sdk: MapKit.framework
      - sdk: Photos.framework
      # PaperKit.framework (macOS 26+ only) and PencilKit.framework were
      # hard-linked here but never used by any code — the link crashed the app
      # on launch for macOS 14/15 users ("Library not loaded: PaperKit").
      # Removed 2026-08-23. If PaperKit is ever actually needed, weak-link it
      # (`weak: true`) and gate usage behind #available(macOS 26, *).
      - sdk: IOKit.framework
      - sdk: WebKit.framework
      - sdk: QuickLookThumbnailing.framework
    scheme:
      testTargets:
        - SwiftMaestroTests

  SwiftMaestroTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SwiftMaestro
    settings:
      SWIFT_VERSION: 6.3
      MACOSX_DEPLOYMENT_TARGET: 14.0
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.woodseedigi.swiftmaestrotests
      CODE_SIGN_IDENTITY: "-"
      # Match the app target so the Objective-C bridging header's
      # Tethering/DAM imports resolve during test-target module scanning,
      # and C++ interop matches the app's objcxx mode.
      HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/libusb/include $(SRCROOT)/Vendor/libraw/include $(SRCROOT)/Vendor/libjpeg/include $(SRCROOT)/Vendor/lcms2/include $(SRCROOT)/Sources"
      SWIFT_OBJC_INTEROP_MODE: objcxx

defaultLanguage: Swift
platforms: []

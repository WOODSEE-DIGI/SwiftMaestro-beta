name: Sync main to SwiftMaestro-beta

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SwiftMaestro
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH for beta remote
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BETA_DEPLOY_KEY }}
          log-public-key: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push main to SwiftMaestro-beta
        run: |
          git remote add beta git@github.com:WOODSEE-DIGI/SwiftMaestro-beta.git
          git push beta main:main --force

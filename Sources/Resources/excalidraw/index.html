<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Excalidraw</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,shrink-to-fit=no"/>
  <meta name="referrer" content="origin"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#121212"/>
  <style>
    html.dark { background-color: #121212; color: #fff; }
    body, html { margin: 0; -webkit-text-size-adjust: 100%; width: 100%; height: 100%; overflow: hidden; }
    #root { height: 100%; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    @media screen and (min-width: 1200px) {
      #root { -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
    }
  </style>
  <script>
    // Theme: default to dark mode for SwiftMaestro integration
    try {
      function setTheme(theme) {
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      }
      var theme = window.localStorage.getItem("excalidraw-theme");
      if (!theme || theme === "system") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      setTheme(theme || "dark");
    } catch (e) {}
  </script>
  <script>
    // Excalidraw uses this to reuse the current tab for library installation.
    window.name = "_excalidraw";
  </script>
  <script>
    // SwiftMaestro bridge — Excalidraw ↔ native communication
    window.__swiftmaestro = {
      // Send a message to Swift
      postMessage: function(type, payload) {
        try {
          window.webkit.messageHandlers.excalidrawBridge.postMessage(
            Object.assign({ type: type }, payload || {})
          );
        } catch (e) {
          console.error("Bridge postMessage failed:", e);
        }
      },
      // Queue of board URLs to load once the Excalidraw API is available.
      _pendingLoads: [],
      // Load a board from a localhost URL.
      loadFile: function(url) {
        var self = this;
        if (!window.excalidrawAPI) {
          console.warn("loadFile called before excalidrawAPI ready; queueing", url);
          self.postMessage("console", { level: "warn", message: "loadFile queued (API not ready): " + url });
          self._pendingLoads.push(url);
          return;
        }
        // Bust caches and avoid reusing a stale failed response.
        var busted = url + (url.indexOf("?") >= 0 ? "&" : "?") + "_=" + Date.now();
        fetch(busted)
          .then(function(response) {
            if (!response.ok) throw new Error("HTTP " + response.status);
            var ct = response.headers.get("content-type") || "";
            if (ct.indexOf("application/json") < 0 && ct.indexOf("text/plain") < 0) {
              throw new Error("Unexpected content-type: " + ct);
            }
            return response.text();
          })
          .then(function(text) {
            var data = JSON.parse(text);
            // Use Excalidraw API to load the scene
            if (window.excalidrawAPI) {
              window.excalidrawAPI.updateScene({
                elements: data.elements || [],
                appState: data.appState || {}
              });
              window.excalidrawAPI.scrollToContent(
                data.elements || [],
                { fitToViewport: true, viewportZoomFactor: 0.8 }
              );
              self.postMessage("fileLoaded", { url: url, elements: (data.elements || []).length });
            } else {
              throw new Error("excalidrawAPI disappeared after fetch");
            }
          })
          .catch(function(e) {
            console.error("Load file failed:", e);
            self.postMessage("console", { level: "error", message: "Load file failed: " + (e && e.message ? e.message : String(e)) });
          });
      },
      // Drain any load requests that arrived before the API was ready.
      _drainPendingLoads: function() {
        while (this._pendingLoads.length && window.excalidrawAPI) {
          this.loadFile(this._pendingLoads.shift());
        }
      },
      // Get current scene data as JSON string
      getSceneData: function() {
        if (window.excalidrawAPI) {
          var data = window.excalidrawAPI.getSceneElements();
          var appState = window.excalidrawAPI.getAppState();
          return JSON.stringify({
            type: "excalidraw",
            version: 2,
            source: "swiftmaestro",
            elements: data,
            appState: appState,
            files: appState.files || {}
          });
        }
        this.postMessage("console", { level: "error", message: "getSceneData: excalidrawAPI not available" });
        return null;
      }
    };

    // Called from Swift to load a file
    window.__swiftmaestro_loadFile = function(url) {
      window.__swiftmaestro.loadFile(url);
    };
  </script>
  <!-- Force Excalidraw to load fonts and dynamic chunks from the local bundle. -->
  <script>
    window.EXCALIDRAW_ASSET_PATH = "/";
  </script>

</head>
<body>
  <div id="root"></div>
  <script>
    // Capture script/module loading failures before the Excalidraw bundle runs.
    window.addEventListener("error", function(event) {
      var msg = "Resource error: " + (event.target && event.target.src ? event.target.src : (event.message || "unknown"));
      console.error(msg);
      if (window.__swiftmaestro) {
        window.__swiftmaestro.postMessage("console", { level: "error", message: msg });
      }
    }, true);

    // After Excalidraw loads, capture the API reference.
    // The bundled app is patched to expose window.excalidrawAPI.
    var _excalidrawCheckCount = 0;
    var _excalidrawCheck = setInterval(function() {
      _excalidrawCheckCount++;
      var root = document.getElementById("root");
      var app = document.querySelector(".excalidraw");
      var api = window.excalidrawAPI;
      if (api) {
        clearInterval(_excalidrawCheck);
        window.__swiftmaestro.postMessage("ready", {});
        window.__swiftmaestro._drainPendingLoads();

        // Watch for element changes
        var observer = new MutationObserver(function() {
          window.__swiftmaestro.postMessage("edited", {});
        });
        observer.observe(root, { childList: true, subtree: true, attributes: true });
      } else if (_excalidrawCheckCount === 100) {
        // 10s: log intermediate state to help diagnose slow/failed mounts.
        var msg = "Excalidraw still mounting... root children=" + (root ? root.childElementCount : "null") + ", .excalidraw found=" + !!app + ", window.excalidrawAPI found=" + !!api;
        console.warn(msg);
        window.__swiftmaestro.postMessage("console", { level: "warn", message: msg });
      } else if (_excalidrawCheckCount > 300) {
        // Give up after ~30s and report that the editor never initialized.
        clearInterval(_excalidrawCheck);
        var diagnostics = "root children=" + (root ? root.childElementCount : "null") + ", .excalidraw found=" + !!app + ", window.excalidrawAPI found=" + !!api;
        var msg = "Excalidraw editor did not initialize after 30s (" + diagnostics + "). Check JS console for errors.";
        console.error(msg);
        window.__swiftmaestro.postMessage("console", { level: "error", message: msg });
      }
    }, 100);

    // Expose save/load for Swift notifications
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "save") {
        var data = window.__swiftmaestro.getSceneData();
        if (data) {
          window.__swiftmaestro.postMessage("save", { data: data });
        }
      }
    });

    // Handle keyboard shortcuts for save
    document.addEventListener("keydown", function(e) {
      if ((e.metaKey || e.ctrlKey) && e.key === "s") {
        e.preventDefault();
        var data = window.__swiftmaestro.getSceneData();
        if (data) {
          window.__swiftmaestro.postMessage("save", { data: data });
        }
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="setup" class="setup hidden">
    <h1>Sign in to Bluesky</h1>
    <p class="hint">
      Use your handle and an <strong>app password</strong> (not your main password).
      Create one at <strong>bsky.app → Settings → App Passwords</strong>.
      You can also browse public posts without signing in.
    </p>
    <label>Handle</label>
    <input id="handleInput" type="text" placeholder="you.bsky.social" autocorrect="off" autocapitalize="off">
    <label>App Password</label>
    <input id="passwordInput" type="password" placeholder="xxxx-xxxx-xxxx-xxxx" autocorrect="off" autocapitalize="off">
    <label>Server (optional)</label>
    <input id="pdsInput" type="text" placeholder="https://bsky.social" autocorrect="off" autocapitalize="off">
    <button id="connectButton">Sign In</button>
    <button id="anonButton" class="secondary">Browse without signing in</button>
    <p id="setupError" class="error hidden"></p>
  </div>

  <div id="app" class="app hidden">
    <header>
      <button id="backButton" class="hidden" title="Back">←</button>
      <img id="headerAvatar" class="header-avatar hidden" alt="">
      <span id="accountLabel" class="account"></span>
      <span class="spacer"></span>
      <button id="refreshButton" title="Refresh now">⟳</button>
      <button id="signInButton" class="text-btn hidden">Sign in</button>
      <div id="settingsWrap" class="settings-wrap hidden">
        <button id="settingsButton" title="Account settings">⋯</button>
        <div id="settingsMenu" class="settings-menu hidden">
          <div id="settingsAccount" class="settings-account"></div>
          <button id="signOutButton" class="settings-item">Sign out</button>
        </div>
      </div>
    </header>

    <nav id="tabs">
      <button id="tabTimeline" class="tab active">Timeline</button>
      <button id="tabSearch" class="tab">Search</button>
    </nav>

    <div id="composeBox" class="compose hidden">
      <textarea id="composeText" placeholder="What's up?" maxlength="3000"></textarea>
      <div class="compose-row">
        <span id="composeCount" class="count">300</span>
        <button id="postButton">Post</button>
      </div>
    </div>

    <div id="searchBox" class="search-box hidden">
      <input id="searchInput" type="text" placeholder="Search Bluesky…" autocorrect="off" autocapitalize="off">
      <div class="search-row">
        <select id="searchType">
          <option value="posts">Posts</option>
          <option value="people">People</option>
        </select>
        <select id="searchSort">
          <option value="latest">Latest</option>
          <option value="top">Top</option>
        </select>
        <button id="searchButton">Search</button>
      </div>
    </div>

    <p id="viewError" class="error hidden"></p>
    <div id="feed" class="feed"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>

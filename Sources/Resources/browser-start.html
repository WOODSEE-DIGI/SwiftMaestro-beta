<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwiftMaestro Browser</title>
  <style>
    :root {
      --bg: #15171a;
      --card: #1e2126;
      --accent: #0a84ff;
      --accent-hover: #3396ff;
      --text: #eef0f5;
      --muted: #9ba3b0;
      --border: #2e323b;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: min(720px, 90vw);
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #34c759, #0a84ff);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(10, 132, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo svg {
      width: 40px;
      height: 40px;
      fill: white;
    }
    h1 { font-size: 28px; margin: 0 0 8px; font-weight: 600; }
    p.subtitle { color: var(--muted); margin: 0 0 32px; font-size: 16px; }
    .search {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .search input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 16px;
      padding: 12px 14px;
    }
    .search input::placeholder { color: var(--muted); }
    .search button {
      background: var(--accent);
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .search button:hover { background: var(--accent-hover); }
    .tips {
      margin-top: 32px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: left;
    }
    @media (max-width: 600px) {
      .tips { grid-template-columns: 1fr; }
    }
    .tip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .tip strong { display: block; margin-bottom: 6px; color: var(--text); }
    .tip span { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 22h20L12 2zm0 4.8l6.4 12.4H5.6L12 6.8z"/>
        <path d="M12 10l-3 6h6l-3-6z" opacity="0.7"/>
      </svg>
    </div>
    <h1>SwiftMaestro Browser</h1>
    <p class="subtitle">Browse the web, capture pages, and clip them to your Notes vault.</p>
    <form class="search" onsubmit="go(event)">
      <input type="text" id="q" placeholder="Search or type a URL" autocomplete="off" />
      <button type="submit">Go</button>
    </form>
    <div class="tips">
      <div class="tip">
        <strong>Navigate</strong>
        <span>Type any URL in the address bar and press Return.</span>
      </div>
      <div class="tip">
        <strong>Clip</strong>
        <span>Use the scissors button to save a page as a Markdown note.</span>
      </div>
      <div class="tip">
        <strong>Switch</strong>
        <span>Right-click a tab to duplicate or close it.</span>
      </div>
    </div>
  </div>
  <script>
    function go(event) {
      event.preventDefault();
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      let url = q;
      if (!/^\w+:\/\//.test(url)) {
        if (/\s/.test(url) || !q.includes('.')) {
          url = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
        } else {
          url = 'https://' + url;
        }
      }
      window.location.href = url;
    }
  </script>
</body>
</html>
